
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nykaa Style Homepage</title>

  <link rel="stylesheet" href="./style.css" >

</head>

<body>

  <header>

    <div class="header">

      <div class="logo">nykaa</div>

      <input
        class="search"
        type="text"
        placeholder="Search products, brands and more"
      >

      <button class="login">Sign In</button>

    </div>

    <nav>
      <a href="#">Makeup</a>
      <a href="#">Skin</a>
      <a href="#">Hair</a>
      <a href="#">Fragrance</a>
      
      
    </nav>

  </header>


  <div class="hero">

    <h1>Beauty Sale</h1>

    <p>
      Discover your favourite makeup and skincare products.
    </p>


    <button class="button">
      Shop Now
    </button>

  </div>

  <div class="hero2">
  <img src="https://images-static.nykaa.com/uploads/2b03b761-9d8e-4fb4-ae70-879aefc78100.png?tr=cm-pad_resize,w-600">
  
  </div>



  <section>

    <h2>Shop By Category</h2>

    <div class="categories">

      <div class="category">
        <img src="https://images.unsplash.com/photo-1596462502278-27bfdc403348?w=300">
        <p>Makeup</p>
      </div>

      <div class="category">
        <img src="https://images.unsplash.com/photo-1556229010-6c3f2c9ca5f8?w=300">
        <p>Skincare</p>
      </div>

      <div class="category">
        <img src="https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9?w=300">
        <p>Haircare</p>
      </div>

      <div class="category">
        <img src="https://images.unsplash.com/photo-1594035910387-fea47794261f?w=300">
        <p>Fragrance</p>
      </div>

      <div class="category">
        <img src="https://images.unsplash.com/photo-1556228720-195a672e8a03?w=300">
        <p>Body Care</p>
      </div>

      <div class="category">
        <img src="https://images.unsplash.com/photo-1598440947619-2c35fc9aa908?w=300">
        <p>Wellness</p>
      </div>

    </div>

  </section>




  <section>

    <h2>Best Sellers</h2>

    <div class="products">

      <div class="product">

        <img src="https://images.unsplash.com/photo-1596462502278-27bfdc403348?w=500">

        <h3>Makeup Collection</h3>

        <p class="price">₹699</p>

      </div>


      <div class="product">

        <img src="https://images.unsplash.com/photo-1611930022073-b7a4ba5fcccd?w=500">

        <h3>Face Serum</h3>

        <p class="price">₹549</p>

      </div>


      <div class="product">

        <img src="https://images.unsplash.com/photo-1608248543803-ba4f8c70ae0b?w=500">

        <h3>Hair Care</h3>

        <p class="price">₹799</p>

      </div>


      <div class="product">

        <img src="https://images.unsplash.com/photo-1594035910387-fea47794261f?w=500">

        <h3>Perfume</h3>

        <p class="price">₹1,299</p>

      </div>

    </div>

  </section>


  <footer>
    © 2026 Beauty Store
  </footer>
